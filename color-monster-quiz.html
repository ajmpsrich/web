.small{font-size:13px}
.pie{animation:popin .8s ease-out both}

.lgs{min-width:150px;text-align:left}
.sl,.lg{cursor:pointer;transition:opacity .2s}
.sl.dim{opacity:.3}.lg.dim{opacity:.45}
.info{background:var(--bg);border:2px dashed var(--line);border-radius:16px;padding:12px;margin:12px 0;text-align:center}

.lg i{width:14px;height:14px;border-radius:50%;flex:none}

.hd{font-size:17px;margin:18px 0 4px;text-align:left}
.m{overflow:visible;transform-origin:50% 90%}

@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(2px)}}
@keyframes shake{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-3px) rotate(-1.5deg)}75%{transform:translateX(3px) rotate(1.5deg)}}

@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes drop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(16px);opacity:0}}
.m-happy{animation:bounce .9s ease-in-out infinite}
.m-sad{animation:sway 2.4s ease-in-out infinite}
.m-angry{animation:shake .35s linear infinite}
.m-scared{animation:tremble .18s linear infinite}
.m-calm{animation:floaty 3s ease-in-out infinite}
.m-pink{animation:pulse 1.1s ease-in-out infinite}
.tear{animation:drop 1.4s ease-in infinite;transform-box:fill-box}
.say{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:2px 12px;font-size:16px;vertical-align:middle}
.say:hover{border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){.m,.tear,.pie{animation:none!important}}
</style>
</head>

];
let i=0,score={},grade="low",tops=[];
const app=document.getElementById("app");
function start(){i=0;score={};ALL.forEach(k=>score[k]=0);
app.innerHTML=`<div class="row">${ALL.map(k=>monster(k,64)).join("")}</div><h1>我是哪一隻情緒小怪獸？</h1><p>6 個小情境，找出今天住在你心裡的情緒小怪獸，還有適合你讀的書喔！</p><p class="small">沒有對錯，每一種情緒都可以！ All feelings are OK! ♡</p><button class="go" onclick="show()">開始測驗</button>`}
function show(){
if(i>=Q.length)return result();
const q=Q[i];
app.innerHTML=`<div class="bar"><i style="width:${i/Q.length*100}%"></i></div><p class="small">第 ${i+1} / ${Q.length} 題</p><div class="scene">${q[0]}</div>`+
q[1].map((t,j)=>[t,j]).sort(()=>Math.random()-.5).map(([t,j])=>`<button class="opt" onclick="pick('${q[2][j]}')">${t}</button>`).join("")}
function pick(k){score[k]++;i++;show()}
function result(){
const s=ALL.slice().sort((a,b)=>score[b]-score[a]);
tops=[s[0]];if(score[s[1]]===score[s[0]])tops.push(s[1]);
grade="low";outfits=[randOutfit(),randOutfit()];render()}
function render(){
const m=E[tops[0]],mix=tops.length>1?E[tops[1]]:null;
const bg=mix?`linear-gradient(90deg,${m.c},${mix.c})`:m.c;
let h=`<div class="row">${monster(tops[0],150,outfits[0],tops[1])}</div><p class="small">今天的裝扮：${[outfits[0]].map(o=>o.map(a=>ACC[a][0]+" "+ACC[a][1]).join("＋")).join("　｜　")}</p><h2>你是「${mix?"混色怪獸（"+m.n+"＋"+mix.n+"）":m.t}」</h2><span class="badge" style="background:${bg}">${m.en}${mix?" + "+mix.en:""}</span><p>${m.desc}${mix?"　"+mix.n+"的比例一樣高，心情混在一起很正常喔！":""}</p>${[m,mix].filter(Boolean).map(x=>`<p><b>${x.like}</b> <button class="say" aria-label="播放英文" onclick="say('${x.en}. ${x.like}')">🔊 聽聽看</button></p>`).join("")}<h2 style="font-size:17px;margin-bottom:6px">📊 你的情緒比例</h2>${bars()}<div class="tip"><b>💡 照顧心情小法寶</b><br>${m.tip}${mix?"<br>"+mix.tip:""}</div><h2>📚 推薦你讀的書</h2><div class="tabs">`;
[["low","低年級"],["mid","中年級"],["high","高年級"]].forEach(([g,n])=>h+=`<button class="tab ${g===grade?"on":""}" onclick="grade='${g}';render()">${n}</button>`);
h+=`</div>`;
tops.forEach(k=>{h+=`<h3 class="hd">${E[k].emo} ${E[k].n}主題</h3>`+list(B[k])});
h+=`<h3 class="hd">🌈 綜合情緒覺察</h3>`+list(B.mix)+(tops.includes("pink")?"":`<h3 class="hd">💗 好好說話、好好交朋友</h3>`+list(B.pink));
h+=`<p class="small">快到圖書館主題書展找找看吧！</p><button class="go" onclick="start()">再測一次</button>`;
app.innerHTML=h}
start();
</script>
